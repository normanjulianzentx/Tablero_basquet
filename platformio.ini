[platformio]
default_envs = board

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -Iinclude

; ==============================================================================
; 1. ESP32 CLÁSICO (DevKit v1 de 30 pines - Xtensa Dual Core)
; ==============================================================================
[env:board]
board = esp32dev
build_src_filter = -<*> +<board/>
lib_deps = fastled/FastLED@3.6.0

[env:remote]
board = esp32dev
build_src_filter = -<*> +<remote/>

; ==============================================================================
; 2. ESP32-C3 MINI V1 IPEX (SuperMini - RISC-V con conector de antena externa)
; ==============================================================================
[env:board_c3]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<board/>
lib_deps = fastled/FastLED@3.6.0
build_flags = 
  -Iinclude
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; ==============================================================================
; 3. MODO EMERGENCIA: SÓLO RELOJ / CRONÓMETRO (LOCAL, VISITA Y FALTAS APAGADOS)
; ==============================================================================
[env:board_c3_emergency]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<board/>
lib_deps = fastled/FastLED@3.6.0
build_flags = 
  -Iinclude
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DEMERGENCY_CLOCK_ONLY=1

[env:remote_c3]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<remote/>
build_flags = 
  -Iinclude
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
